function parseProcurementDate(s){
  if(!s||s==="TBD"||s==="")return null;
  const qm=s.match(/Q([1-4])\s*(\d{4})/i);
  if(qm){const mo=[0,3,6,9][parseInt(qm[1])-1];return new Date(parseInt(qm[2]),mo,1);}
  const hm=s.match(/H([12])\s*(\d{4})/i);
  if(hm){return new Date(parseInt(hm[2]),hm[1]==="1"?0:6,1);}
  const ym=s.match(/^(\d{4})$/);
  if(ym)return new Date(parseInt(ym[1]),0,1);
  const mm=s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{4})/i);
  if(mm){const mos=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];return new Date(parseInt(mm[2]),mos.indexOf(mm[1].toLowerCase()),1);}
  const iso=s.match(/^(\d{4})-(\d{1,2})/);
  if(iso){const mo=parseInt(iso[2]);if(mo>=1&&mo<=12)return new Date(parseInt(iso[1]),mo-1,1);}
  const eml=s.match(/\b(early|mid|late)\s+(\d{4})/i);
  if(eml){const mo={early:0,mid:5,late:8}[eml[1].toLowerCase()];return new Date(parseInt(eml[2]),mo,1);}
  return null;
}
function isStale(p){

  // Planning and Pre-tender are NEVER hidden — they always represent future BD opportunity.
  if((p.procurementStatus||"")==="Cancelled")return true;
  if((p.procurementStatus||"")!=="Under Construction")return false;
  const d=parseProcurementDate(p.procurementStart);
  if(!d)return false;
  const cut=new Date();cut.setMonth(cut.getMonth()-6);
  return d<cut;
}
function hasDateStatusMismatch(p){
  // Informational flag only (DATE? badge) — no hiding.
  // Fires when Planning/Pre-tender has a procurementStart already in the past,
  // suggesting Gemini's date or status may need verification.
  if(p._check&&p._check.fresh&&!p._check.outdated&&!Object.keys(p._check.suggested||{}).length)return false; // v9: re-checked recently, nothing left to confirm
  const status=p.procurementStatus||"";
  if(status!=="Planning"&&status!=="Pre-tender")return false;
  const d=parseProcurementDate(p.procurementStart);

}
// ---- Round 1 (2026-11-23): stable keys, dedupe, MP relevance score ----
// Stable key: tolerant to "Project" suffix, "&"/"and", punctuation/spacing and a trailing
// acronym that just repeats the name ("... Storage System (BESS)"). Keeps lots/states distinct.
function keyOf(name){
  let s=String(name||"");
  s=s.replace(/^(.*?)\s*\(([A-Za-z]{2,6})\)\s*$/,(all,pre,acr)=>pre.split(/[\s\-–]+/).filter(Boolean).map(w=>w[0]).join("").toLowerCase().endsWith(acr.toLowerCase())?pre:all);
  return s.toLowerCase().replace(/&/g," and ").replace(/\bproject\b/g," ").replace(/[^a-z0-9à-ÿ]+/g,"");
}
// Old saved names that the scan later renamed (pins / contacts keyed by name).
const KEY_ALIASES={"vni west (western renewables link)":"transgrid vni west / keranglink"};
function richness(p){return Object.values(p).filter(v=>Array.isArray(v)?v.length:(v!==null&&v!==undefined&&String(v).trim()!==""&&v!=="TBD")).length+(p.statusConfidence==="high"?2:0);}
function dedupeProjects(list){
  const by=new Map();
  (list||[]).filter(p=>p&&p.projectName).forEach(p=>{
    const k=keyOf(p.projectName);const cur=by.get(k);
    if(!cur){by.set(k,{...p,_dupNames:[]});return;}
    const keep=richness(p)>richness(cur)?{...p,_dupNames:[...cur._dupNames,cur.projectName]}:{...cur,_dupNames:[...cur._dupNames,p.projectName]};
    by.set(k,keep);
  });
  // v8 pass 2: same owner + country, same identifying tokens (M4, SC2, Stage 2, Lot 8…)
  // and one name's words contained in the other's ("NEXTDC M4" ⊂ "M4 Melbourne Data Centre Campus").
  const out=[];
  [...by.values()].forEach(p=>{
    const sig=nameSig(p);
    const i=out.findIndex(q=>looksSameProject(sig,q._sig));
    if(i<0){out.push({...p,_sig:sig});return;}
    const cur=out[i];const pWins=richness(p)>richness(cur);
    out[i]=pWins?{...p,_sig:sig,_dupNames:[...cur._dupNames,...p._dupNames,cur.projectName]}:{...cur,_dupNames:[...cur._dupNames,...p._dupNames,p.projectName]};
  });

}
const NAME_STOP=new Set("the and of de da do das dos e project projeto data centre center centres centers campus facility site development dc".split(" "));
function nameSig(p){
  const owners=splitCompanies(p.owner);
  const fold=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(Boolean);
  const ownerWords=new Set(owners.flatMap(fold));
  const words=fold(p.projectName).filter(w=>!NAME_STOP.has(w)&&!ownerWords.has(w));
  const ids=words.filter(w=>/\d/.test(w)&&!/^\d+(mw|mwh|gw|gwh|kv|mva)$/.test(w));
  return {owner:owners.length?coKey(owners[0]):"",country:String(p.country||"").toLowerCase(),words:new Set(words),ids:new Set(ids)};
}
function looksSameProject(a,b){
  const same=(x,y)=>x.size===y.size&&[...x].every(v=>y.has(v));
  const sub=(x,y)=>[...x].every(v=>y.has(v));
  if(!a.owner||a.owner!==b.owner||a.country!==b.country||!same(a.ids,b.ids))return false;
  if(a.ids.size)return sub(a.words,b.words)||sub(b.words,a.words);
  return a.words.size>0&&same(a.words,b.words);
}
function isTxOrSub(p){return assetHay(p,/transmission|interconnector|hvdc|substation|switchyard/);}
function monthsFromNow(d){const n=new Date();return (d.getFullYear()-n.getFullYear())*12+(d.getMonth()-n.getMonth());}

function mpScore(p){

  s+=({"Tender Active":20,"Pre-tender":18,"Awarded":16,"Planning":8,"Under Construction":6,"Cancelled":-100})[p.procurementStatus]??5;

const WINDOW_BUCKETS=["Now","0–6 m","6–12 m","12–24 m","24 m+","TBD"];
// Re-key a {lowercaseName: value} store onto the canonical (deduped) project names.
function remapStore(obj,canonByKey,merge){
  const out={},orphans=[];let changed=false;
  Object.keys(obj||{}).forEach(k=>{
    const alias=KEY_ALIASES[k];

// v9: apply the weekly status re-checks. The safety rules live here, not in Make:
// a check only counts while the scan record still has the values it checked; status only moves
// forward (or to Cancelled); dates must be a quarter/half-year; an EPC only fills an empty one.
const STATUS_RANK={"Planning":0,"Pre-tender":1,"Tender Active":2,"Awarded":3,"Under Construction":4};

const EMPTYISH=/^(tbd|tba|none|unknown|n\/a|-|not (specified|known|disclosed|announced|selected)( yet)?)?$/i;
function applyStatusChecks(list,checks){
  const latest=new Map();

    // otherwise the findings are shown as suggestions

function computeChangeStatus(cur, prev){
  const prevMap=new Map();
  (prev||[]).filter(p=>p&&p.projectName).forEach(p=>[p.projectName,...(p._dupNames||[])].forEach(n=>{const k=keyOf(n);if(!prevMap.has(k))prevMap.set(k,p);}));
  const watch=["procurementStatus","procurementStart","capacityMW","mpEngagementWindow","projectValue"];
  return cur.map(p=>{
    const hit=[p.projectName,...(p._dupNames||[])].map(keyOf).find(k=>prevMap.has(k));
    const pr=hit?prevMap.get(hit):null;
    if(!pr) return {...p,_changeStatus:"new",_changedFields:[]};

function ConfidenceDot({confidence}){

  const map={high:{c:"#d9d9d9",t:"High confidence — AI verified with 2025-2026 source"},medium:{c:"#FDB422",t:"Medium confidence — based on 2024 source, may be slightly stale"},low:{c:"#ff5555",t:"⚠ Low confidence — pre-2024 source or inferred. Verify manually."}};
  const {c="#555",t=confidence}=map[confidence]||{};
  return <span title={t} style={{display:"inline-block",width:"7px",height:"7px",borderRadius:"50%",background:c,verticalAlign:"middle",marginLeft:"3px",flexShrink:0,cursor:"help"}}/>;
}

function ScoreBar({score}){

  </div>;
}
// Single-series horizontal bars (one hue = magnitude). Each row is clickable → drills into the table.
// Company leaderboard: split multi-company strings, drop placeholders, merge case/suffix variants
// ("NEXTDC" = "NextDC", "Neoen Australia" = "Neoen"). Label = shortest variant, so a search for it
// also finds the longer spellings.
const CO_JUNK=/^(tbd|tba|n\/?a|none|unknown|not specified|not yet|not disclosed|not announced|tenderers?|various|multiple|to be |others?$|private|undisclosed|-+$|—)/i;
function splitCompanies(v){
  let s=Array.isArray(v)?v.join(", "):String(v||"");
  for(let i=0;i<2;i++)s=s.replace(/\([^()]*\)/g,"");
  return s.split(/,|;|\s\/\s/).map(x=>x.replace(/\s+/g," ").trim()).filter(x=>x.length>1&&!CO_JUNK.test(x));
}
function coKey(n){return n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\b(pty|ltd|limited|group|s\.?a\.?|inc|plc|corporation|holdings|australia|brasil|brazil|energia)\b\.?/g," ").replace(/[^a-z0-9]+/g,"");}
function companyLeaders(list,field,n){
  const m=new Map();
  list.forEach(p=>{const seen=new Set();splitCompanies(p[field]).forEach(name=>{const k=coKey(name);if(!k||seen.has(k))return;seen.add(k);const e=m.get(k)||{label:name,value:0,focus:0};if(name.length<e.label.length)e.label=name;e.value++;if(p._score>=FOCUS_MIN)e.focus++;m.set(k,e);});});
  return [...m.values()].filter(e=>e.value>1).sort((a,b)=>b.value-a.value||b.focus-a.focus||a.label.localeCompare(b.label)).slice(0,n);
}
// Other projects that share an owner or EPC/supplier with p (same company-key matching as the leaderboard).
function relatedProjects(p,all,n){
  const F2=["owner","epcContractor"];
  const mine=new Map();
  F2.forEach(f=>splitCompanies(p[f]).forEach(c=>{const k=coKey(c);if(k&&!mine.has(k))mine.set(k,{name:c,count:0});}));
  if(!mine.size)return {list:[],companies:[]};
  const out=[];
  all.forEach(q=>{
    if(q.projectName===p.projectName)return;
    const hits=new Set();
    F2.forEach(f=>splitCompanies(q[f]).forEach(c=>{const k=coKey(c);if(mine.has(k))hits.add(k);}));
    if(!hits.size)return;
    hits.forEach(k=>mine.get(k).count++);
    out.push({p:q,via:[...hits].map(k=>mine.get(k).name)});
  });
  out.sort((a,b)=>(b.p._pinned-a.p._pinned)||(isStale(a.p)-isStale(b.p))||(b.p._score-a.p._score));
  return {list:out.slice(0,n),total:out.length,companies:[...mine.values()].filter(c=>c.count>0).sort((a,b)=>b.count-a.count)};
}

const BD_TYPE_COLORS={"Developer":"#d9d9d9","Tenderer":"#9a9a9a","EPC":C.yellow,"Financier":"#9a9a9a"};
// Companies the scan already knows for this project, by contact type — feeds the
// Company combo box on the BD tab so known names never have to be re-typed.
function knownCompanies(p,type){
  const split=v=>{const s=Array.isArray(v)?v.join(","):(v||"");return s.split(/,|;|\/|\band\b|&/).map(x=>x.replace(/\(.*?\)/g,"").trim()).filter(x=>x.length>1);};
  let src;
  if(type==="Developer")src=p.owner;
  else if(type==="Financier")src=p.financiers||p.fundingSources;
  else src=p.epcContractor; // Tenderer + EPC share the epcContractor field
  const parts=split(src);
  const whole=(Array.isArray(src)?src.join(", "):String(src||"")).trim();
  const all=whole&&parts.length>1?[whole,...parts]:parts;
  return [...new Set(all)];
}

      {!loading&&(
        <div style={{background:"#060606",padding:"0 28px",borderBottom:"1px solid "+C.border,display:"flex",justifyContent:"space-between",alignItems:"stretch",flexWrap:"wrap"}}>
          <div style={{display:"flex",overflowX:"auto",overflowY:"hidden",maxWidth:"100%",scrollbarWidth:"none"}}>
            {[{key:"dashboard",label:"DASHBOARD"},{key:"table",label:"PROJECT TABLE"},{key:"bd",label:"CONTACTS"}].map(t=>(
              <button key={t.key} onClick={()=>setTab(t.key)} disabled={t.key==="detail"&&!selected} style={{background:"none",border:"none",borderBottom:tab===t.key?"3px solid "+C.yellow:"3px solid transparent",color:tab===t.key?C.yellow:(t.key==="detail"&&!selected)?"#444":"#bbb",fontFamily:F,fontWeight:"bold",fontSize:"13px",letterSpacing:"0.2px",padding:"14px 20px",cursor:(t.key==="detail"&&!selected)?"default":"pointer",marginBottom:"-1px",display:"flex",alignItems:"center",gap:"6px"}}>
                {t.label}{t.key==="detail"&&selected&&<span style={{background:C.yellow,color:C.black,fontSize:"11px",padding:"1px 5px",borderRadius:"2px"}}>1</span>}
              </button>
            ))}
          </div>
          {tab!=="dashboard"&&<div style={{display:"flex",alignItems:"center",gap:"10px",padding:"10px 0",flexWrap:"wrap"}}>
            <button onClick={()=>setFFocus(v=>!v)} title={"MP Focus: relevance score ≥ "+FOCUS_MIN+" (HV/substation/data-centre fit + procurement window + status), plus your pins"} style={{background:fFocus?C.yellow:"#0d0d0d",color:fFocus?C.black:"#bbb",border:"1px solid "+(fFocus?C.yellow:C.border),padding:"6px 10px",fontFamily:F,fontSize:"12px",fontWeight:"bold",letterSpacing:"0.2px",cursor:"pointer"}}>{fFocus?"★ MP FOCUS":"ALL PROJECTS"}</button>
            {fBucket&&<button onClick={()=>setFBucket(null)} title="Clear engagement-window filter" style={{background:C.yellow,color:C.black,border:"1px solid "+C.yellow,padding:"6px 10px",fontFamily:F,fontSize:"12px",fontWeight:"bold",letterSpacing:"0.2px",cursor:"pointer"}}>WINDOW: {fBucket} ✕</button>}
            {fVerify&&<button onClick={()=>setFVerify(false)} title="Showing only projects whose procurement date has passed but status is still Planning / Pre-tender. Click to clear." style={{background:"#1a0808",color:"#ff8a8a",border:"1px solid #ff5555",padding:"6px 10px",fontFamily:F,fontSize:"12px",fontWeight:"bold",letterSpacing:"0.2px",cursor:"pointer"}}>DATES TO VERIFY ✕</button>}
            <div style={{position:"relative",display:"inline-block"}}>
              <input value={fSearch} onChange={e=>setFSearch(e.target.value)} placeholder="Search projects…" style={{background:"#0d0d0d",color:C.white,border:"1px solid "+(fSearch.trim()?C.yellow:C.border),padding:"6px 26px 6px 10px",fontFamily:F,fontSize:"13px",outline:"none",width:"180px",letterSpacing:"0.3px",boxSizing:"border-box"}}/>
              {fSearch&&<button onClick={()=>setFSearch("")} title="Clear search" style={{position:"absolute",right:"6px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#888",cursor:"pointer",fontSize:"14px",lineHeight:1,padding:"2px"}}>✕</button>}
            </div>
            {[
              {val:fCountry,set:setFCountry,opts:["All","Australia","Brazil"],ph:"ALL COUNTRIES"},
              {val:fChange,set:setFChange,opts:["All","New","Updated"],ph:"ALL CHANGES"},
            ].map((f,i)=>(
              <select key={i} value={f.val} onChange={e=>f.set(e.target.value)} style={{background:"#0d0d0d",color:"#bbb",border:"1px solid "+C.border,padding:"6px 10px",fontFamily:F,fontSize:"12px",letterSpacing:"0.2px",cursor:"pointer"}}>
                {f.opts.map(o=><option key={o} value={o}>{o==="All"?f.ph:o.toUpperCase()}</option>)}
              </select>
            ))}
            <div data-dd="1" style={{position:"relative"}}>
              <button onClick={()=>setStatusOpen(o=>!o)} style={{background:fStatus.length?C.yellow:"#0d0d0d",color:fStatus.length?C.black:"#bbb",border:"1px solid "+(fStatus.length?C.yellow:C.border),padding:"6px 10px",fontFamily:F,fontSize:"12px",fontWeight:fStatus.length?"bold":"normal",letterSpacing:"0.2px",cursor:"pointer"}}>
                {fStatus.length?"STATUS ("+fStatus.length+")":"ALL STATUSES"} ▾
              </button>
              {statusOpen&&(
                <div style={{position:"absolute",top:"32px",left:0,background:"#0d0d0d",border:"1px solid "+C.border,zIndex:50,minWidth:"180px",padding:"6px 0",boxShadow:"0 4px 12px rgba(0,0,0,0.5)"}}>
                  {["Pre-tender","Tender Active","Awarded","Under Construction","Planning","Cancelled"].map(s=>(
                    <label key={s} style={{display:"flex",alignItems:"center",gap:"8px",padding:"6px 12px",cursor:"pointer",fontFamily:F,fontSize:"13px",color:fStatus.includes(s)?C.yellow:"#888"}}>
                      <input type="checkbox" checked={fStatus.includes(s)} onChange={()=>setFStatus(cur=>cur.includes(s)?cur.filter(x=>x!==s):[...cur,s])} style={{accentColor:C.yellow}}/>
                      {s}
                    </label>
                  ))}
                </div>
              )}
            </div>
            <div data-dd="1" style={{position:"relative"}}>
              <button onClick={()=>setAssetsOpen(o=>!o)} style={{background:fAssets.length?"#bdbdbd":"#0d0d0d",color:fAssets.length?C.black:"#bbb",border:"1px solid "+(fAssets.length?"#bdbdbd":C.border),padding:"6px 10px",fontFamily:F,fontSize:"12px",fontWeight:fAssets.length?"bold":"normal",letterSpacing:"0.2px",cursor:"pointer"}}>
                {fAssets.length?"ASSET TYPES ("+fAssets.length+")":"ALL ASSET TYPES"} ▾
              </button>
              {assetsOpen&&(
                <div style={{position:"absolute",top:"32px",left:0,background:"#0d0d0d",border:"1px solid "+C.border,zIndex:50,minWidth:"190px",padding:"6px 0",boxShadow:"0 4px 12px rgba(0,0,0,0.5)"}}>
                  {ASSET_KEYS.map(s=>(
                    <label key={s} style={{display:"flex",alignItems:"center",gap:"8px",padding:"6px 12px",cursor:"pointer",fontFamily:F,fontSize:"13px",color:fAssets.includes(s)?"#bdbdbd":"#888"}}>
                      <input type="checkbox" checked={fAssets.includes(s)} onChange={()=>setFAssets(cur=>cur.includes(s)?cur.filter(x=>x!==s):[...cur,s])} style={{accentColor:"#bdbdbd"}}/>
                      {s==="Data Centre"?"Data Centre":s==="HV Transmission"?"HV Transmission":s==="Substation"?"Substation":s}
                    </label>
                  ))}
                  <div style={{padding:"6px 12px 2px",color:"#555",fontFamily:F,fontSize:"11px",lineHeight:1.4}}>Shows projects matching ANY ticked type</div>
                </div>
              )}
            </div>
            <div data-dd="1" style={{position:"relative"}}>
              <button onClick={()=>setProcStartOpen(o=>!o)} style={{background:fProcStart.length?C.yellow:"#0d0d0d",color:fProcStart.length?C.black:"#bbb",border:"1px solid "+(fProcStart.length?C.yellow:C.border),padding:"6px 10px",fontFamily:F,fontSize:"12px",fontWeight:fProcStart.length?"bold":"normal",letterSpacing:"0.2px",cursor:"pointer"}}>
                {fProcStart.length?"PROC. DATE ("+fProcStart.length+")":"ALL PROC. DATES"} ▾
              </button>
              {procStartOpen&&(
                <div style={{position:"absolute",top:"32px",left:0,background:"#0d0d0d",border:"1px solid "+C.border,zIndex:50,minWidth:"160px",maxHeight:"260px",overflowY:"auto",padding:"6px 0",boxShadow:"0 4px 12px rgba(0,0,0,0.5)"}}>
                  {[...new Set(withPins.map(p=>p.procurementStart).filter(v=>v&&v!=="TBD"&&v!==""))].sort((a,b)=>{const da=parseProcurementDate(a),db=parseProcurementDate(b);return (da?da.getTime():Infinity)-(db?db.getTime():Infinity);}).map(s=>(
                    <label key={s} style={{display:"flex",alignItems:"center",gap:"8px",padding:"6px 12px",cursor:"pointer",fontFamily:F,fontSize:"13px",color:fProcStart.includes(s)?C.yellow:"#888"}}>
                      <input type="checkbox" checked={fProcStart.includes(s)} onChange={()=>setFProcStart(cur=>cur.includes(s)?cur.filter(x=>x!==s):[...cur,s])} style={{accentColor:C.yellow}}/>
                      {s}
                    </label>
                  ))}
                </div>
              )}
            </div>
            <button onClick={()=>setFHideStale(v=>!v)} style={{background:fHideStale?"#0d0d0d":"#444444",color:fHideStale?"#bbb":C.white,border:"1px solid "+(fHideStale?"#333":"#444444"),padding:"6px 10px",fontFamily:F,fontSize:"12px",fontWeight:fHideStale?"normal":"bold",letterSpacing:"0.2px",cursor:"pointer"}} title="Hides: Cancelled projects, and Under Construction where equipment procurement started more than 6 months ago. Planning & Pre-tender are never hidden.">{fHideStale?"SHOW STALE":"HIDE STALE"}</button>
            {anyFilter&&<button onClick={resetFilters} style={{background:"none",border:"1px solid #333",color:"#999",padding:"6px 12px",fontFamily:F,fontSize:"12px",letterSpacing:"0.2px",cursor:"pointer"}}>✕ RESET FILTERS</button>}
          </div>}
        </div>
      )}
      {!loading&&!error&&(
        <div style={{padding:"24px 28px"}}>
          {withPins.length===0?(
            <div style={{textAlign:"center",padding:"100px 20px",color:"#666",fontFamily:F}}>No project data found yet.</div>
          ):tab==="table"?(
            <div>
              {(()=>{const all=[...PRESET_VIEWS,...userViews];const matched=all.some(v=>normView(v.f)===curNorm);return <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",marginBottom:"14px"}}>
                <span style={{color:"#888",fontSize:"13px",marginRight:"2px"}}>Views</span>
                {all.map(v=>{const on=normView(v.f)===curNorm;return <span key={(v.preset?"p:":"u:")+v.name} style={{display:"inline-flex",alignItems:"center",border:"1px solid "+(on?C.yellow:"#333"),background:on?C.yellow:"#0d0d0d"}}>
                  <button onClick={()=>applyView(v.f)} title={v.preset?"Built-in view":"Your saved view"} style={{background:"none",border:"none",color:on?C.black:"#ddd",fontFamily:F,fontSize:"13px",fontWeight:on?700:400,padding:"5px 10px",cursor:"pointer"}}>{v.name}</button>
                  {!v.preset&&<button onClick={()=>deleteUserView(v.name)} title="Delete this view" aria-label={"Delete view "+v.name} style={{background:"none",border:"none",borderLeft:"1px solid "+(on?"#b07d10":"#333"),color:on?C.black:"#777",cursor:"pointer",fontSize:"12px",padding:"5px 7px"}}>✕</button>}
                </span>;})}
                {!matched&&<button onClick={saveCurrentView} title="Save the current filters as a named view (kept in this browser)" style={{background:"none",border:"1px dashed #555",color:"#bbb",fontFamily:F,fontSize:"13px",padding:"5px 10px",cursor:"pointer"}}>+ Save current view</button>}
              </div>;})()}
              <div style={{color:"#888",fontFamily:F,fontSize:"13px",marginBottom:"12px",display:"flex",gap:"16px",flexWrap:"wrap"}}>
                <span>Showing {displayed.length} of {withPins.length} projects — click a row for details</span>
<span style={{color:"#bdbdbd"}}>data centre</span>
                <span style={{color:C.newColor}}>NEW = added this scan</span>
                <span style={{color:C.updatedColor}}>↻ updated</span>
                <span style={{color:"#9a9a9a"}}>✎ overridden</span>
                <span><span style={{display:"inline-block",width:"7px",height:"7px",borderRadius:"50%",background:"#ff5555",verticalAlign:"middle"}}></span> low conf — verify</span>
                <button onClick={()=>exportCSV(displayed)} title="Download the currently filtered rows as CSV (opens in Excel)" style={{marginLeft:"auto",background:"#1a1a1a",color:C.yellow,border:"1px solid "+C.yellow,padding:"4px 12px",fontFamily:F,fontSize:"12px",fontWeight:"bold",cursor:"pointer",letterSpacing:"0.2px"}}>⬇ Export CSV ({displayed.length})</button>
              </div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",minWidth:"980px",tableLayout:"fixed"}}>
                  <thead><tr>
                    <ColHead label="Project Name" k="projectName" style={{width:"200px"}}/>
                    <ColHead label="Score" k="_score" style={{width:"62px"}}/>
                    <ColHead label="Location" k="location" style={{width:"115px"}}/>
                    <ColHead label="Equip. Proc." k="procurementStart" style={{width:"88px"}}/>
                    <ColHead label="Status" k="procurementStatus" style={{width:"110px"}}/>
                    <ColHead label="MW" k="capacityMW" style={{width:"46px",textAlign:"center"}}/>
                    <ColHead label="Key Assets" k="assetTypes" style={{width:"120px"}}/>
                    <ColHead label="Owner / Developer" k="owner" style={{width:"130px"}}/>
                    <ColHead label="EPC / TENDERER" k="epcContractor" style={{width:"120px"}}/>
                  </tr></thead>
                  <tbody>
                    {displayed.map((p,i)=>{
                      const sel=selected&&selected.projectName===p.projectName;
                      const accent=sel||p._pinned?C.yellow:p._changeStatus==="new"?C.newColor:p._changeStatus==="updated"?C.updatedColor:null;
                      const open=()=>openProject(p);
                      return (
                        <tr key={i} style={{background:sel?"#1a1200":p._pinned?"#0a0800":i%2===0?"#070707":C.card,cursor:"pointer",borderLeft:accent?"3px solid "+accent:"3px solid transparent"}}>
                          <td onClick={open} style={TD({color:C.white,fontWeight:"bold",whiteSpace:"normal",overflowWrap:"break-word"})}>
                            <div style={{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap"}}>
                              <PinButton p={p} onToggle={pinToggle}/>
                              <Flag country={p.country}/><span style={{fontSize:"13px"}} title={(p._dupNames||[]).length?"Also listed by the scan as: "+p._dupNames.join(" · "):undefined}>{p.projectName}</span>{isDataCentre(p)&&<DCBadge/>}<ChangeBadge status={p._changeStatus}/>
                            </div>
                          </td>
                          <td onClick={open} title="MP relevance: asset fit + procurement window + status" style={TD({whiteSpace:"nowrap"})}><ScoreBar score={p._score}/></td>
                          <td onClick={open} style={TD(hl(p,"location",{color:"#ccc",fontSize:"13px",whiteSpace:"normal",overflowWrap:"break-word"}))}>{p.location}</td>
                          <td onClick={open} style={TD(hl(p,"procurementStart",{color:C.yellow,fontWeight:"bold",padding:"9px 8px",whiteSpace:"normal",overflowWrap:"break-word",lineHeight:1.3,fontSize:"13px"}))}>{p.procurementStart||"TBD"}</td>
                          <td onClick={open} style={TD(hl(p,"procurementStatus",{}))}><div style={{display:"flex",alignItems:"center",gap:"4px",flexWrap:"wrap"}}><Badge text={p.procurementStatus} type="status"/><ConfidenceDot confidence={p.statusConfidence}/>{p._overrideMeta&&<OverrideBadge/>}{hasDateStatusMismatch(p)&&<span title={"Equip. proc. date ("+p.procurementStart+") already passed but status is still "+p.procurementStatus+" — verify with source"} style={{color:"#ff5555",fontSize:"11px",fontWeight:"bold",cursor:"help",letterSpacing:"0.3px",fontFamily:F}}>DATE?</span>}{p._check&&p._check.fresh&&!p._check.outdated&&<span title={"Re-checked online on "+p._check.checkedAt+(Object.keys(p._check.applied).length?" — updated":" — "+p._check.result)} style={{color:Object.keys(p._check.applied).length?C.yellow:"#8a8a8a",fontSize:"11px",cursor:"help",fontFamily:F,whiteSpace:"nowrap"}}>✓ checked {fmtDM(p._check.checkedAt)}</span>}</div></td>
                          <td onClick={open} style={TD(hl(p,"capacityMW",{color:C.yellow,whiteSpace:"nowrap",textAlign:"center",fontWeight:"bold",fontSize:"13px"}))}>{p.capacityMW?Number(p.capacityMW).toLocaleString():"—"}</td>
                          <td onClick={open} style={TD({color:"#ccc",fontSize:"13px",whiteSpace:"normal",overflowWrap:"break-word"})}>{(p.assetTypes||[]).join(", ")}</td>
                          {[[coList(p.owner)||(p.companies&&!p.epcContractor&&!p.financiers?coList(p.companies):"")||"—","#ddd"],[coList(p.epcContractor)||coList(p.companies)||"—","#ccc"]].map(([txt,col],j)=>
                            <td key={j} onClick={open} style={TD({color:col,fontSize:"13px",whiteSpace:"normal",overflowWrap:"break-word"})}><div title={txt.length>40?txt:undefined} style={{display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden",lineHeight:1.4}}>{txt}</div></td>)}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          ):tab==="dashboard"?(
            <DashboardView projects={withPins} onDrill={drill} onSelect={openProject} orphanPins={orphanPins} onRemoveOrphan={removeOrphanPin} bdData={bdData} onGoContacts={goContacts}/>
          ):tab==="bd"?(
            <BDView projects={withPins.filter(p=>p._pinned)} bdData={bdData} sugData={sugData} onSaveRow={saveBDRow} onUpdateSug={updateSug} onImportSug={importSug} onSelect={openProject} searchQuery={fSearch} onExportBackup={exportBackup} onRestoreBackup={restoreBackup} restoreN={restoreN} onlyNoContacts={bdNoContacts} onClearNoContacts={()=>setBdNoContacts(false)}/>
          ):null}
        </div>
      )}
      {selected&&(()=>{const sp={...selected,...(withPins.find(p=>p.projectName===selected.projectName)||{})};return <div onClick={closeDetail} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",justifyContent:"flex-end"}}>
        <div role="dialog" aria-label={"Project detail: "+sp.projectName} onClick={e=>e.stopPropagation()} style={{width:"min(560px,100%)",height:"100%",overflowY:"auto",boxShadow:"-12px 0 32px rgba(0,0,0,0.6)"}}>
          <DetailPanel key={sp.projectName} project={sp} related={relatedProjects(sp,withPins,8)} onOpenRelated={q=>setSelected(q)} onSearchCompany={name=>{setSelected(null);drill({focus:false,search:name});}} onClose={closeDetail} onPinToggle={pinToggle} onSetOverride={setStatusOverride} onClearOverride={clearStatusOverride} onSetProcStart={setProcStartOverride} onSetEpc={setEpcOverride}/>
        </div>
      </div>;})()}
      <div style={{borderTop:"1px solid "+C.border,padding:"14px 28px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px",fontFamily:F,fontSize:"12px"}}>
        <span style={{color:"#666"}}>Commercial in Confidence · MADEPARTNERS</span>
        <a href="https://www.madepartners.com" target="_blank" rel="noreferrer" style={{color:C.yellow,letterSpacing:"0.2px",textDecoration:"none"}}>WWW.MADEPARTNERS.COM</a>
      </div>
    </div>
  );
}
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  render(){
    if(this.state.err){
      return <div style={{background:"#000",minHeight:"100vh",color:"#e05050",fontFamily:F,fontSize:"14px",padding:"60px 28px"}}>
        <div style={{fontWeight:"bold",marginBottom:"10px"}}>⚠ Dashboard hit an unexpected error and stopped rendering.</div>
        <div style={{color:"#888",marginBottom:"16px"}}>Usually caused by a malformed record in projects.json / projects-prev.json. Details:</div>
        <pre style={{color:"#aaa",whiteSpace:"pre-wrap"}}>{String(this.state.err&&(this.state.err.message||this.state.err))}</pre>
        <button onClick={()=>location.reload()} style={{marginTop:"16px",background:"#FDB422",color:"#000",border:"none",padding:"8px 16px",fontWeight:"bold",cursor:"pointer"}}>RELOAD</button>
      </div>;
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("mp-root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
